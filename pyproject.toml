[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kcsd"
version = "0.1.0"
description = "Kernel Conditional Stein Discrepancy: the Section 3.3 V-statistic estimator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
test = ["pytest>=7", "scipy>=1.9"]
demo = ["matplotlib>=3.6", "scipy>=1.9"]

[tool.setuptools]
packages = ["kcsd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
